services:
  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=${S3_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${S3_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKETS=${S3_BUCKET}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-net
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

networks:
  app-net:
    driver: bridge

volumes:
  minio_data:
    driver: local
